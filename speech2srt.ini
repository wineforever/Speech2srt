[paths]
upload_dir = backend/uploads
output_dir = backend/outputs

[runtime]
backend_conda_env = F:\miniconda\envs\unsloth
backend_python =

[service]
max_content_length_mb = 100
supported_formats = wav,mp3
max_audio_duration = 0
max_concurrent_tasks = 3
preview_max_chars = 8000
preview_max_segments = 200

[asr]
asr_engine = bcut
asr_model_path = F:/Models/Qwen/Qwen3-ASR-0.6B
asr_device = cuda:0
asr_dtype = bfloat16
asr_local_files_only = true
asr_attention_impl =
asr_max_batch_size = 32
asr_max_new_tokens = 2048
asr_chunk_seconds = 60
asr_unload_after_task = true
asr_trust_remote_code = true

[subtitle]
subtitle_max_chars = 60
subtitle_min_duration = 0.4

[output]
output_version_name = v1
